version: 2
updates:
  # Enable npm dependency updates
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    # Assign PRs to a specific team or user if needed, and add labels
    labels:
      - 'dependencies'
      - 'npm'
    # Set commit message prefixes for conventional commits
    commit-message:
      prefix: 'build'
      include: 'scope'

  # Enable GitHub Actions updates
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'ci'
      include: 'scope'
