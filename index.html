<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Dashboard</title>
    <link rel="stylesheet" href="styles/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header role="banner">
        <h1 id="main-heading">Delivery Dashboard</h1>
    </header>
    <main id="dashboard-container" role="main" aria-labelledby="main-heading">
        <section id="system-health" aria-labelledby="system-health-heading" role="region"></section>
        <section id="alerts" aria-labelledby="alerts-heading" role="status"></section>
        <section id="sprint-status" aria-labelledby="sprint-status-heading" role="status"></section>
        <section id="upcoming-releases" aria-labelledby="releases-heading" role="status"></section>
        <section id="knowledge-hub" aria-labelledby="knowledge-hub-heading" role="region"></section>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
