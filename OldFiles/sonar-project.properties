# sonar-project.properties (workspace root)
# Created/updated to use the Node executable path you provided.
# Replace sonar.projectKey with your actual project key if available.
sonar.projectKey=your.project.key
sonar.projectName=Delivery Dashboard
sonar.sources=src

# Exclude files from analysis
sonar.exclusions=**/node_modules/**,**/*.spec.js,**/*.test.js

# Explicit Node path (Windows): backslashes escaped
sonar.nodejs.executable=C:\\Program Files\\nodejs\\node.exe
